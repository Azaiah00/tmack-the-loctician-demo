<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Netlify Forms detection file. Do not delete: the contact form posts here. -->
    <form name="contact" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="company" />
      <input name="name" />
      <input name="phone" />
      <input name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
